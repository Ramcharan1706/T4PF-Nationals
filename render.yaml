services:
  - type: web
    name: sound-buddy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_BACKEND
        value: supabase
      - key: DEMO_MODE
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REGISTRATION_ORGANIZATION_ID
        value: 11111111-1111-1111-1111-111111111111
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://t4-pf-nationals.vercel.app